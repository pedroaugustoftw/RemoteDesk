# TLS termination / WSS edge. Separate media relay available at /relay/ws.
# Replace remotedesk.example.com and mount real certificate files before starting.
events { worker_connections 1024; }
http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone $binary_remote_addr zone=connections:10m rate=10r/s;
    # Private API bridge: not published by Compose and only server is allowed.
    server {
        listen 8082;
        allow 172.30.48.2;
        deny all;
        location / {
            proxy_pass http://relay:8081;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 80;
        server_name remotedesk.example.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name remotedesk.example.com;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 2m;
        location ~* ^/relay/sessions(?:/|$) { return 404; }
        location /relay/ {
            limit_req zone=connections burst=30 nodelay;
            proxy_pass http://relay:8081/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_buffering off;
        }
        location / {
            limit_req zone=connections burst=30 nodelay;
            proxy_pass http://server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_buffering off;
        }
    }
}
