name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            portable/requirements.txt
            .github/workflows/release.yml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libxcb-xkb1 libdbus-1-3 xvfb python3-tk scrot gnome-keyring libsecret-1-0
      - name: Isolate OpenSSL for Intel macOS source build
        if: matrix.name == 'macos-x64'
        run: |
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: python -m pip install -r portable/requirements.txt pyinstaller==6.22.3
      - name: Verify Intel cryptography does not depend on shared OpenSSL
        if: matrix.name == 'macos-x64'
        run: |
          python -c "from cryptography.hazmat.bindings import _rust; import subprocess; deps=subprocess.check_output(['otool','-L',_rust.__file__],text=True); print(deps); assert 'libssl' not in deps and 'libcrypto' not in deps"
      - run: dotnet build server/RemoteDesk.Server.csproj -c Release
      - run: dotnet build relay/RemoteDesk.Relay.csproj -c Release
      - name: Protocol and file security tests
        run: python -m unittest discover -s portable/tests -v
        env:
          PYTHONPATH: portable
      - name: Real .NET signaling and relay integration
        run: python portable/tests/integration.py
        env:
          PYTHONPATH: portable
      - name: Build native desktop package
        run: python scripts/build-portable.py
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.name }}
          path: artifacts/release/*
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: ./scripts/publish-client.ps1
        shell: pwsh
      - run: ./scripts/publish-server-service.ps1
        shell: pwsh
      - run: dotnet run --project tests/installation -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            artifacts/win-x64/installer/RemoteDesk-Setup.exe
            artifacts/win-x64/server-installer/RemoteDesk-Server-Setup.exe
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [portable, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Flatten and calculate checksums
        run: |
          mkdir -p published
          find release -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.tar.gz' \) -exec cp {} published/ \;
          cd published
          sha256sum * > SHA256SUMS.txt
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" published/* --prerelease --title "RemoteDesk $GITHUB_REF_NAME" --notes-file docs/release-notes.md
